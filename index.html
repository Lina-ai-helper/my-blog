<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <script>
    // 스타일 적용 전에 테마를 정해 깜빡임을 막는다
    (function () {
      let theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <section class="apps-section container">
    <h2 class="apps-title">미니 웹앱</h2>
    <ul class="app-list">
      <li class="app-card">
        <a class="app-card-link" href="apps/2048/index.html">
          <div class="app-preview" aria-hidden="true">
            <iframe src="apps/2048/index.html" title="2048 게임 미리보기" tabindex="-1" loading="lazy"></iframe>
          </div>
          <div class="app-card-body">
            <h3>2048</h3>
            <p>방향키 또는 스와이프로 타일을 밀어 같은 숫자를 합치는 퍼즐 게임. 점수판과 최고 점수 기록 포함.</p>
          </div>
        </a>
      </li>
      <li class="app-card">
        <a class="app-card-link" href="apps/pixel-art/index.html">
          <div class="app-preview" aria-hidden="true">
            <iframe src="apps/pixel-art/index.html" title="픽셀 아트 에디터 미리보기" tabindex="-1" loading="lazy"></iframe>
          </div>
          <div class="app-card-body">
            <h3>픽셀 아트 에디터</h3>
            <p>16x16 격자에 도트를 찍어 그림을 그리는 에디터. 색상 팔레트, 되돌리기, PNG 저장 기능 포함.</p>
          </div>
        </a>
      </li>
    </ul>
  </section>

  <main class="container" id="app">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 My Blog</div>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
