<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <meta name="description" content="4x4 격자에서 같은 숫자 타일을 합쳐 2048을 만드는 퍼즐 게임">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>2048</h1>
    <div class="header-row">
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">점수</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">최고 점수</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
      <button type="button" id="new-game-btn" class="new-game-btn">새 게임</button>
    </div>
  </header>

  <main>
    <p class="instructions">방향키 또는 보드 위 스와이프로 타일을 움직여 같은 숫자를 합쳐보세요.</p>

    <div class="board-wrap">
      <div class="board" id="board"></div>

      <div class="overlay" id="overlay" role="alert" hidden>
        <div class="overlay-card">
          <p class="overlay-message" id="overlay-message"></p>
          <div class="overlay-actions">
            <button type="button" id="overlay-keep-playing-btn" class="overlay-btn secondary" hidden>계속하기</button>
            <button type="button" id="overlay-restart-btn" class="overlay-btn">다시 시작</button>
          </div>
        </div>
      </div>
    </div>

    <p class="sr-only" id="status-announcer" aria-live="polite"></p>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
